<!DOCTYPE html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ovax — pentest & dev</title>
<link rel="icon" href="https://raw.githubusercontent.com/banaxou/banaxou/main/icon.jpg">

<style>
:root {
--accent: #a259ff;
--accent-glow: rgba(162, 89, 255, 0.55);
--bg-overlay: rgba(18, 10, 32, 0.72);
--text: #f2eefc;
--text-dim: #c9bfe0;
}

* {
box-sizing: border-box;
}

body {
margin: 0;
min-height: 100vh;
background: #0b0710 url("https://raw.githubusercontent.com/banaxou/banaxou/main/rukia.gif") no-repeat center center fixed;
background-size: cover;
display: flex;
align-items: center;
justify-content: center;
font-family: 'Segoe UI', Arial, sans-serif;
color: var(--text);
padding: 40px 16px 100px;
}

body::before {
content: "";
position: fixed;
inset: 0;
background: linear-gradient(180deg, rgba(0,0,0,0.35), rgba(0,0,0,0.55));
z-index: 0;
}

.card {
position: relative;
z-index: 1;
background: var(--bg-overlay);
padding: 48px 56px;
border-radius: 20px;
border: 1px solid rgba(162, 89, 255, 0.35);
box-shadow: 0 0 40px var(--accent-glow), 0 20px 50px rgba(0,0,0,0.6);
text-align: center;
backdrop-filter: blur(10px);
max-width: 480px;
width: 100%;
}

.profile {
width: 120px;
height: 120px;
border-radius: 50%;
border: 3px solid var(--accent);
object-fit: cover;
box-shadow: 0 0 18px var(--accent-glow);
}

h1 {
font-size: 2.4em;
margin: 20px 0 4px;
text-transform: uppercase;
letter-spacing: 6px;
color: #fff;
}

.tagline {
margin: 0;
font-size: 1em;
font-family: 'Consolas', 'Courier New', monospace;
color: var(--accent);
opacity: 0.9;
}

.links {
margin-top: 32px;
display: flex;
justify-content: center;
gap: 14px;
flex-wrap: wrap;
list-style: none;
padding: 0;
}

.links a {
color: var(--text);
text-decoration: none;
display: flex;
align-items: center;
gap: 8px;
font-size: 0.95em;
padding: 8px 14px;
border-radius: 999px;
border: 1px solid rgba(255,255,255,0.15);
background: rgba(255,255,255,0.04);
transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
}

.links a:hover,
.links a:focus-visible {
transform: translateY(-2px);
border-color: var(--accent);
background: rgba(162, 89, 255, 0.15);
}

.links a:focus-visible {
outline: 2px solid var(--accent);
outline-offset: 2px;
}

.icon {
width: 16px;
height: 16px;
}

.spotify {
margin-top: 28px;
}

.spotify iframe {
width: 100%;
max-width: 400px;
border-radius: 12px;
}

footer {
position: fixed;
bottom: 18px;
left: 0;
right: 0;
text-align: center;
font-family: 'Consolas', 'Courier New', monospace;
font-size: 0.85em;
color: var(--text-dim);
letter-spacing: 1px;
z-index: 1;
}

@media (max-width: 480px) {
.card {
padding: 36px 24px;
}
h1 {
font-size: 1.9em;
letter-spacing: 4px;
}
}

</style>
</head>

<body>
